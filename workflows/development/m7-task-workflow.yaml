# M7 Task Development Workflow
# Automated workflow for M7 methodology tasks

name: M7 Task Workflow
version: "1.0"

triggers:
  - task_creation
  - phase_completion
  - risk_escalation
  - quality_gate_check

phases:
  discovery:
    duration_percent: 25
    required_files:
      - DISCOVERY_REPORT.md
    quality_gates:
      - research_completeness_check
      - context7_verification
      - stakeholder_sign_off
    agents:
      - research
    deliverables:
      - comprehensive_research
      - risk_identification
      - recommendation_set

  architecture:
    duration_percent: 15
    required_files:
      - ARCHITECTURE_CONTEXT.md
    quality_gates:
      - architectural_review
      - integration_validation
      - performance_baseline
    agents:
      - architecture
    deliverables:
      - system_analysis
      - integration_mapping
      - architectural_decisions

  planning:
    duration_percent: 40
    required_files:
      - SOLUTION_PLAN.md
      - IMPACT_ANALYSIS.md
      - IMPLEMENTATION_SIMULATION.md
      - RISK_MITIGATION.md
    quality_gates:
      - plan_review
      - impact_assessment
      - risk_mitigation_approval
      - simulation_validation
    agents:
      - implementation
      - security
      - research
    deliverables:
      - detailed_implementation_plan
      - risk_assessment
      - mitigation_strategies
      - code_simulation

  implementation:
    duration_percent: 20
    required_files:
      - IMPLEMENTATION_REPORT.md
    quality_gates:
      - code_review
      - testing_validation
      - security_audit
      - performance_verification
    agents:
      - implementation
      - testing
      - security
    deliverables:
      - working_code
      - test_coverage
      - documentation
      - deployment_artifacts

quality_gates:
  critical_risk_check:
    trigger: "risk_level == 'critical'"
    action: "block_progression"
    approvers:
      - security_team
      - architecture_team
      - project_manager

  major_risk_check:
    trigger: "risk_level == 'major'"
    action: "require_approval"
    approvers:
      - team_lead
      - stakeholder

  minor_risk_check:
    trigger: "risk_level == 'minor'"
    action: "proceed_with_monitoring"
    notification:
      - team_lead

automation:
  file_generation:
    - template_creation
    - structure_validation
    - cross_references

  agent_coordination:
    - task_assignment
    - parallel_execution
    - result_aggregation

  quality_monitoring:
    - completeness_check
    - consistency_validation
    - timeline_tracking

notifications:
  phase_completion:
    channels:
      - slack
      - email
    recipients:
      - team_members
      - stakeholders

  risk_escalation:
    channels:
      - slack
      - pagerduty
    recipients:
      - security_team
      - management

  quality_gate_failure:
    channels:
      - slack
    recipients:
      - development_team
      - qa_team
